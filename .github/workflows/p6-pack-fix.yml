name: p6-pack-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Phase 6 pack installer repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/operations-state.mjs')
          s = p.read_text()
          old = '--find-links /cache/sezu/sources/python "$2==$3"'
          new = '--find-links /cache/sezu/sources/python/artifacts "$2==$3"'
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit('expected one locked Python cache path')
              p.write_text(s.replace(old, new, 1))
          PY
          grep -F -- '--find-links /cache/sezu/sources/python/artifacts "$2==$3"' src/operations-state.mjs
          git diff --check
          git rm .github/workflows/p6-pack-fix.yml
          git config user.name 'StealthEyeLLC'
          git config user.email '247854506+StealthEyeLLC@users.noreply.github.com'
          git add src/operations-state.mjs
          git commit -m 'Install Python packs from locked artifact cache'
          git push origin HEAD:main
