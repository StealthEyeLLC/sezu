name: p6-binwalk-retry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Retry Phase 6 Binwalk repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Publish validated repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/p6-binwalk.patch
          import base64, pathlib, re
          text = pathlib.Path('.github/workflows/p6-binwalk-fix.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/p6-binwalk\.patch", text)
          if not match:
              raise SystemExit('embedded patch not found')
          import sys
          sys.stdout.buffer.write(base64.b64decode(match.group(1)))
          PY
          git apply --check /tmp/p6-binwalk.patch
          git apply /tmp/p6-binwalk.patch
          git diff --check
          git rm .github/workflows/p6-binwalk-fix.yml .github/workflows/p6-binwalk-retry.yml .github/p6-binwalk-trigger .github/p6-binwalk-trigger2
          git config user.name 'StealthEyeLLC'
          git config user.email '247854506+StealthEyeLLC@users.noreply.github.com'
          git add src/operations-state.mjs test/unit/binwalk-pack-installer.test.mjs
          git commit -m 'Build locked Binwalk source in pack cells'
          git push origin HEAD:main
