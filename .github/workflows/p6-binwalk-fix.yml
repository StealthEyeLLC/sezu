name: p6-binwalk-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Execute Phase 6 Binwalk repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply and validate repair
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/p6-binwalk.patch
          git apply --check /tmp/p6-binwalk.patch
          git apply /tmp/p6-binwalk.patch
          npm ci --ignore-scripts
          npm run check
          npm test
          python3 scripts/validate-locks.py
          git diff --check
          git rm .github/workflows/p6-binwalk-fix.yml .github/p6-binwalk-trigger
          git config user.name 'StealthEyeLLC'
          git config user.email '247854506+StealthEyeLLC@users.noreply.github.com'
          git add src/operations-state.mjs test/unit/binwalk-pack-installer.test.mjs
          git commit -m 'Build locked Binwalk source in pack cells'
          git push origin HEAD:main
