name: p6-pack-state-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Phase 6 pack-state repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/operations-state.mjs')
          s=p.read_text()
          anchor="""async function packRecord(target, packId) {
            const targetKey = target.replace(/[:/]/g, '_'); return path.join(ROOTS.packs, targetKey, `${packId}.json`);
          }
          """
          insert=anchor+"""
          export function packStateMatchesTarget(state, target, currentIdentity) {
            if (!state) return false;
            if (!String(target).startsWith('cell:')) return true;
            return Boolean(currentIdentity && state.target_identity && state.target_identity === currentIdentity);
          }

          async function packTargetIdentity(target) {
            if (!String(target).startsWith('cell:')) return null;
            const instance = targetInstance(target);
            if (!instance) return null;
            try {
              const result = await runIncusCli(['config', 'get', instance, 'volatile.uuid', '--project', PROJECT]);
              return result.stdout.toString('utf8').trim() || null;
            } catch {
              return null;
            }
          }

          async function packStateForTarget(target, packId, targetIdentity = undefined) {
            const state = await readJson(await packRecord(target, packId), null);
            const identity = targetIdentity === undefined ? await packTargetIdentity(target) : targetIdentity;
            return packStateMatchesTarget(state, target, identity) ? state : null;
          }
          """
          if s.count(anchor)!=1: raise SystemExit('packRecord anchor mismatch')
          s=s.replace(anchor,insert,1)
          old="""  runtime.register('sezu.pack.list', async (args, target) => { const lock = await loadPackLock(); const packs = []; for (const pack of lock.packs) { const state = await readJson(await packRecord(target, pack.pack_id), null); packs.push({ ...pack, status: BASE_PACKS.has(pack.pack_id) && target === 'u' ? 'built-in' : (state?.state || 'not-installed'), installed_state: state }); } return { result: { target, packs, count: packs.length } }; }, { mutating: false, family: 'pack' });
          runtime.register('sezu.pack.status', async (args, target) => { const id = required(args, 'pack_id', 'string'); const lock = await loadPackLock(); const pack = lock.packs.find(x => x.pack_id === id); if (!pack) throw new SezuError('pack_not_found', `pack not found: ${id}`); const state = await readJson(await packRecord(target, id), null); return { result: { ...pack, target, status: BASE_PACKS.has(id) && target === 'u' ? 'built-in' : (state?.state || 'not-installed'), installed_state: state } }; }, { mutating: false, family: 'pack' });
          """
          new="""  runtime.register('sezu.pack.list', async (args, target) => { const lock = await loadPackLock(); const targetIdentity = await packTargetIdentity(target); const packs = []; for (const pack of lock.packs) { const state = await packStateForTarget(target, pack.pack_id, targetIdentity); packs.push({ ...pack, status: BASE_PACKS.has(pack.pack_id) && target === 'u' ? 'built-in' : (state?.state || 'not-installed'), installed_state: state }); } return { result: { target, packs, count: packs.length } }; }, { mutating: false, family: 'pack' });
          runtime.register('sezu.pack.status', async (args, target) => { const id = required(args, 'pack_id', 'string'); const lock = await loadPackLock(); const pack = lock.packs.find(x => x.pack_id === id); if (!pack) throw new SezuError('pack_not_found', `pack not found: ${id}`); const state = await packStateForTarget(target, id); return { result: { ...pack, target, status: BASE_PACKS.has(id) && target === 'u' ? 'built-in' : (state?.state || 'not-installed'), installed_state: state } }; }, { mutating: false, family: 'pack' });
          """
          if s.count(old)!=1: raise SystemExit('pack list/status anchor mismatch')
          s=s.replace(old,new,1)
          old="""      const state = { pack_id: id, target, state: 'installed', installed_at: now(), components: installed, installed_packages: installedPackages };
                const file = await packRecord(target, id); await ensureDir(path.dirname(file)); await atomicJson(file, state);
          """
          new="""      const targetIdentity = await packTargetIdentity(target);
                if (String(target).startsWith('cell:') && !targetIdentity) throw new SezuError('target_unreachable', `cannot identify target instance for pack state: ${target}`);
                const state = { pack_id: id, target, target_identity: targetIdentity, state: 'installed', installed_at: now(), components: installed, installed_packages: installedPackages };
                const file = await packRecord(target, id); await ensureDir(path.dirname(file)); await atomicJson(file, state);
          """
          if s.count(old)!=1: raise SystemExit('pack install state anchor mismatch')
          s=s.replace(old,new,1)
          old="""    const file = await packRecord(target, id);
              const state = await readJson(file, null);
              if (!state) return { result: { pack_id: id, target, state: 'not-installed' } };
          """
          new="""    const file = await packRecord(target, id);
              const recordedState = await readJson(file, null);
              const state = packStateMatchesTarget(recordedState, target, await packTargetIdentity(target)) ? recordedState : null;
              if (!state) { if (recordedState) await fsp.rm(file, { force: true }); return { result: { pack_id: id, target, state: 'not-installed', stale_record_removed: Boolean(recordedState) } }; }
          """
          if s.count(old)!=1: raise SystemExit('pack remove state anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('test/unit/pack-state-identity.test.mjs').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { packStateMatchesTarget } from "../../src/operations-state.mjs";\n\ntest("cell pack state is bound to its Incus instance identity", () => {\n  const state = { target: "cell:p6-cell", target_identity: "uuid-a", state: "installed" };\n  assert.equal(packStateMatchesTarget(state, "cell:p6-cell", "uuid-a"), true);\n  assert.equal(packStateMatchesTarget(state, "cell:p6-cell", "uuid-b"), false);\n  assert.equal(packStateMatchesTarget({ target: "cell:p6-cell", state: "installed" }, "cell:p6-cell", "uuid-a"), false);\n  assert.equal(packStateMatchesTarget({ target: "u", state: "installed" }, "u", null), true);\n});\n''')
          PY
          git diff --check
          git rm .github/workflows/p6-pack-state-fix.yml
          git config user.name 'StealthEyeLLC'
          git config user.email '247854506+StealthEyeLLC@users.noreply.github.com'
          git add src/operations-state.mjs test/unit/pack-state-identity.test.mjs
          git commit -m 'Bind cell pack state to instance identity'
          git push origin HEAD:main
