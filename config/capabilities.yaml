version: 1
product: sezu
release: 0.1.0
public_tool: call_sezu
namespace: sezu.*
protocol: SEZU1/1.0.0

base_packs:
  - sezu-core
  - data-core
  - document-core
  - wasm-core
  - network-core
  - machine-image-core
  - cross-build-core

on_demand_packs:
