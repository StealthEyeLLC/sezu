  - language-kotlin
  - language-julia
  - language-r
  - language-elixir-erlang
  - language-lua
  - language-dart
  - language-powershell
  - language-swift
  - language-fortran
  - language-haskell
  - language-ocaml
  - language-scala
  - language-clojure
  - data-spark
  - cad-3d
  - binary-firmware
  - cloud-aws
  - cloud-azure
  - cloud-gcp
  - cloud-cloudflare
  - storage-extra

service_templates:
  - service-postgresql
  - service-mariadb
  - service-redis
  - service-mongodb
  - service-clickhouse
  - service-qdrant
  - service-meilisearch
  - service-opensearch
  - service-rabbitmq
